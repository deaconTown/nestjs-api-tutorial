version: '3.8'
services:
  dev-db:
    image: postgres:alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_DB: nest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    networks:
      - freecodecamp
  test-db:
    image: postgres:alpine
    ports:
      - '5435:5432'
    environment:
      POSTGRES_DB: nest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    networks:
      - freecodecamp
networks:
  freecodecamp:
